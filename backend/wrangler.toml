name = "comeback-os-ai"
main = "src/index.js"
compatibility_date = "2026-11-12"

[vars]
# Replace with the exact published GitHub Pages origin (no trailing slash).
ALLOWED_ORIGINS = "https://aakxrsh-og.github.io"
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Required by the Worker. Keep this namespace ID unique within the Cloudflare account.
[[ratelimits]]
name = "MENTOR_RATE_LIMIT"
namespace_id = "25025"

  [ratelimits.simple]
  limit = 10
  period = 60

# GEMINI_API_KEY MUST be added as an encrypted Worker secret.
# Never put it in this file, app.js, GitHub Pages, or a committed .env file.
